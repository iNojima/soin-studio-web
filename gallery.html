    <script>
        // =============================================================
        // 料理ギャラリー: Googleスプレッドシートから読み込み
        //
        // index.html の予約カレンダーと同じスプレッドシートを使います。
        // 「料理ギャラリー」という名前のシート（タブ）を追加し、
        // 1行目を見出し、2行目以降に以下の順で入力してください。
        //
        //   A列: 日付      （例: 2026-06-20  ※空欄でもOK）
        //   B列: 料理名    （例: 塩麹の鶏ハム）
        //   C列: 説明      （例: しっとり柔らかく仕上がる定番メニュー）
        //   D列: 画像URL   （pic/xxx.jpg もしくは https://〜 / Googleドライブ共有リンク可）
        //   E列: コース    （任意。例: 体験コース）
        //
        // 新しい行を追加すると、このページに自動で反映されます。
        // =============================================================
        const SHEET_ID = '1E-PgJq141bd9YRqQl1CpafBR1cD7nEpvEsLrfY9XQD0';
        const API_KEY = 'AIzaSyAG-W3NPFc-O2NMtYAp28dmV4qb_3-jk_4';
        const GALLERY_SHEET_NAME = encodeURIComponent('料理ギャラリー');

        const grid = document.getElementById('galleryGrid');
        const statusEl = document.getElementById('galleryStatus');

        // Googleドライブの共有リンクを画像表示用URLに変換
        function normalizeImageUrl(url) {
            if (!url) return '';
            url = url.trim();
            const drive = url.match(/drive\.google\.com\/file\/d\/([^/]+)/) ||
                          url.match(/drive\.google\.com\/open\?id=([^&]+)/);
            if (drive) return `https://drive.google.com/thumbnail?id=${drive[1]}&sz=w800`;
            return url;
        }

        function escapeHtml(s) {
            return (s || '').replace(/[&<>"']/g, c => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            }[c]));
        }

        function renderGallery(rows) {
            // 新しい順（日付の降順）に並べ替え。日付が無い行は元の順を尊重して末尾に。
            const indexed = rows.map((r, i) => ({ r, i }));
            indexed.sort((a, b) => {
                const da = (a.r[0] || '').trim(), db = (b.r[0] || '').trim();
                if (da && db) return db.localeCompare(da);
                if (da) return -1;
                if (db) return 1;
                return a.i - b.i;
            });

            const cards = indexed.map(({ r }) => {
                const date = escapeHtml(r[0]);
                const title = escapeHtml(r[1]);
                const desc = escapeHtml(r[2]);
                const img = normalizeImageUrl(r[3]);
                const tag = escapeHtml(r[4]);
                if (!title && !img) return '';
                return `
                    <article class="gallery-card">
                        ${img ? `<img src="${escapeHtml(img)}" alt="${title || '教室で作った麹料理'}" class="gallery-card-img" loading="lazy">` : ''}
                        <div class="gallery-card-body">
                            ${date ? `<div class="gallery-card-date">${date}</div>` : ''}
                            <h3 class="gallery-card-title">${title}</h3>
                            ${desc ? `<p class="gallery-card-desc">${desc}</p>` : ''}
                            ${tag ? `<span class="gallery-card-tag">${tag}</span>` : ''}
                        </div>
                    </article>`;
            }).join('');

            grid.innerHTML = cards;
            statusEl.style.display = 'none';
        }

        fetch(`https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/${GALLERY_SHEET_NAME}!A:E?key=${API_KEY}`)
            .then(res => {
                if (!res.ok) throw new Error('sheet not found');
                return res.json();
            })
            .then(data => {
                const rows = (data.values || []).slice(1).filter(r => (r[1] || r[3]));
                if (rows.length === 0) {
                    statusEl.textContent = 'お料理の記録はただいま準備中です。';
                    return;
                }
                renderGallery(rows);
            })
            .catch(() => {
                statusEl.innerHTML =
                    'お料理の記録はただいま準備中です。<br>最新のお料理は上記のInstagramからもご覧いただけます。';
            });

        // =============================================================
        // Instagram リール: GoogleスプレッドシートのURLを公式埋め込みで表示
        //
        // 同じスプレッドシートに「リール」という名前のシート（タブ）を追加し、
        // A列にリールのURLを1行ずつ貼り付けてください（1行目は見出しでOK）。
        //
        //   A列（リールURL）の例:
        //     https://www.instagram.com/reel/Cxxxxxxxxxx/
        //
        // ▼リールURLのコピー方法（スマホアプリ）
        //   リールを開く → 右下の「紙ヒコーキ」や「…」→「リンクをコピー」
        //
        // 新しいリールを投稿したら、行を1つ足すだけでこのページに反映されます。
        // 表示件数の上限は MAX_REELS で調整できます（読み込みを軽くするため）。
        // =============================================================
        const REEL_SHEET_NAME = encodeURIComponent('リール');
        const MAX_REELS = 12;

        const reelGrid = document.getElementById('reelGrid');
        const reelStatus = document.getElementById('reelStatus');

        function loadInstagramEmbedScript() {
            return new Promise(resolve => {
                if (window.instgrm && window.instgrm.Embeds) { resolve(); return; }
                let s = document.getElementById('ig-embed-script');
                if (s) { s.addEventListener('load', () => resolve()); return; }
                s = document.createElement('script');
                s.id = 'ig-embed-script';
                s.async = true;
                s.src = 'https://www.instagram.com/embed.js';
                s.onload = () => resolve();
                s.onerror = () => resolve();
                document.body.appendChild(s);
            });
        }

        function renderReels(urls) {
            const list = urls.slice(0, MAX_REELS);
            reelGrid.innerHTML = list.map(url => `
                <blockquote class="instagram-media"
                    data-instgrm-permalink="${url}"
                    data-instgrm-version="14"
                    style="background:#FFF; border:0; border-radius:12px; margin:0; max-width:340px; width:100%;">
                </blockquote>`).join('');
            reelStatus.style.display = 'none';
            loadInstagramEmbedScript().then(() => {
                if (window.instgrm && window.instgrm.Embeds) window.instgrm.Embeds.process();
            });
        }

        fetch(`https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/${REEL_SHEET_NAME}!A:A?key=${API_KEY}`)
            .then(res => {
                if (!res.ok) throw new Error('reel sheet not found');
                return res.json();
            })
            .then(data => {
                const urls = (data.values || [])
                    .map(r => (r[0] || '').trim().split('?')[0])
                    .filter(u => /instagram\.com\/(reel|p|tv)\//.test(u));
                if (urls.length === 0) {
                    reelStatus.innerHTML = 'リールはただいま準備中です。<br>下のボタンからInstagramでご覧いただけます。';
                    return;
                }
                renderReels(urls);
            })
            .catch(() => {
                reelStatus.innerHTML = 'リールはただいま準備中です。<br>下のボタンからInstagramでご覧いただけます。';
            });
    </script>
